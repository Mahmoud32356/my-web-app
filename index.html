<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تطبيق محمود عثمان</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        /* تصميم شاشة انقطاع الإنترنت */
        #offline-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #f8f9fa;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Tahoma, sans-serif;
            text-align: center;
            padding: 20px;
            z-index: 9999;
        }
        #offline-screen h2 {
            color: #333;
            margin-bottom: 10px;
        }
        #offline-screen p {
            color: #666;
            margin-bottom: 20px;
        }
        #offline-screen button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- عرض الموقع داخل الإطار (WebView افتراضي للويب) -->
    <iframe id="site-frame" src="https://mahmoudasman.amwaly.com/" allow="camera; microphone; geolocation; payment"></iframe>

    <!-- شاشة تنبيه في حال انقطاع الإنترنت -->
    <div id="offline-screen">
        <h2>لا يوجد اتصال بالإنترنت</h2>
        <p>يرجى التحقق من اتصالك بالشبكة ثم المحاولة مرة أخرى.</p>
        <button onclick="location.reload()">إعادة المحاولة</button>
    </div>

    <script>
        // التحقق من حالة الإنترنت
        window.addEventListener('online',  updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);

        function updateOnlineStatus() {
            const offlineScreen = document.getElementById('offline-screen');
            if (!navigator.onLine) {
                offlineScreen.style.display = 'flex';
            } else {
                offlineScreen.style.display = 'none';
            }
        }
        
        // التحقق عند فتح التطبيق أول مرة
        updateOnlineStatus();
    </script>
</body>
</html>
