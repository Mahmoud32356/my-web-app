<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>المدّاح</title>
    <link rel="stylesheet" href="style.css">
    <script src="cordova.js"></script>
</head>
<body>
    <!-- شاشة التحميل والشاشة عند انقطاع الإنترنت -->
    <div id="offline-screen" class="screen">
        <div class="loader-content">
            <div class="spinner"></div>
            <h2>مدونة المدّاح</h2>
            <p id="status-text">جاري الاتصال بالشبكة...</p>
            <button id="retry-btn" onclick="checkConnectionAndLoad()">إعادة المحاولة</button>
        </div>
    </div>

    <!-- إطار عرض الموقع WebView -->
    <iframe id="web-frame" src="about:blank"></iframe>

    <script src="main.js"></script>
</body>
</html>
