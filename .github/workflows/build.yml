name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Accept Android SDK Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Install Cordova
      run: npm install -g cordova

    - name: Create and Build Cordova App
      run: |
        cordova create app com.almadaah.app "Almadaah"
        cd app
        rm -rf www/*
        cp ../index.html www/index.html
        cordova platform add android@10.1.2
        cordova plugin add cordova-plugin-admob-free --variable ADMOB_APP_ID="ca-app-pub-7293684166978355~9579740993"
        cordova build android --debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Almadaah-App-APK
        path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
