name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Setup Cordova Project
      run: |
        cordova create cordova_app com.almadaah.app "Almadaah"
        cd cordova_app
        rm -rf www/*
        cp ../index.html www/index.html
        cordova platform add android@12.0.0
        cordova plugin add cordova-plugin-admob-plus --variable APP_ID_ANDROID="ca-app-pub-7293684166978355~9579740993"

    - name: Build Android APK
      run: |
        cd cordova_app
        cordova build android --debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Almadaah-App-APK
        path: cordova_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
