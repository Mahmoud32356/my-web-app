name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Accept Android SDK Licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Install Cordova CLI
      run: npm install -g cordova@11.1.0

    - name: Create and Build Cordova App
      run: |
        cordova create app com.almadaah.app "Almadaah"
        cd app
        cp -r ../index.html www/index.html 2>/dev/null || true
        cordova platform add android@10.1.2
        cordova plugin add cordova-plugin-admob-free
        
        # إجبار Cordova على استخدام Gradle Wrapper الداخلي المتوافق بدلاً من Gradle 9 النظام
        chmod +x platforms/android/gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Almadaah-App-APK
        path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
